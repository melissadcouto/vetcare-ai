function wf(aid,key,x){if(!DB.baselines[aid])DB.baselines[aid]={};var B=DB.baselines[aid];var b=B[key]||(B[key]={n:0,mean:0,m2:0,sd:0});b.n++;var d=x-b.mean;b.mean+=d/b.n;b.m2+=d*(x-b.mean);b.sd=b.n>1?Math.sqrt(b.m2/(b.n-1)):0}
function gb(aid,k){return DB.baselines[aid]?DB.baselines[aid][k]:null}
function updateBL(aid,f){for(var k in FEAT){if(typeof f[k]==='number')wf(aid,k,f[k])}var s=f.symptoms||{};for(var sk in s){wf(aid,'sym_'+sk,s[sk])}}
function calcScore(aid,f){
  var ev=[],raw=0;
  for(var k in FEAT){var x=f[k];if(typeof x!=='number')continue;var d=FEAT[k],b=gb(aid,k),z=0,note='';
    if(b&&b.n>=4){var sd=Math.max(b.sd,0.055);var dd=(x-b.mean)/sd;if(d.inv)dd=-dd;z=cl(dd,0,4);note=r2(x)+' vs '+r2(b.mean)}
    else note=r2(x)+' (learning)';
    var c=d.w*z;raw+=c;
    if(c>0.04)ev.push({type:'feat',key:k,c:c,n:note,dir:z>1.5?'bad':z>0.6?'mid':'ok'});
  }
  var s=f.symptoms||{};
  for(var sk in s){var cc=s[sk];if(!(cc>0))continue;var D=SYM[sk];if(!D)continue;var bb=gb(aid,'sym_'+sk);var chr=(bb&&bb.n>=6)?Math.min(bb.mean,0.85):0;var c2=D.w*cc*(1-chr);raw+=c2;
    if(c2>0.04)ev.push({type:'sym',key:sk,c:c2,n:chr>0.25?'usual':'reported',dir:'bad'});
  }
  if(raw===0&&s&&Object.keys(s).length>0)raw=0.5;
  var sc=Math.round(cl(100*(1-Math.exp(-raw/5)),0,100));
  ev.sort(function(a,b){return b.c-a.c});
  return{score:sc,raw:r2(raw),evidence:ev,confidence:Math.min(95,Math.round(50+sc*0.45))};
}
function ingest(aid,src,f,opts){
  opts=opts||{};

  DB.observations.push(o);
  if(res.score<=30||opts.force)updateBL(aid,f);
  if(res.score>30){
    var an=DB.animals.find(function(a){return a.id===aid});
    var ex=DB.alerts.find(function(a){return a.animalId===aid&&a.status==='active'&&a.ts>nw()-24*HOUR});
    if(ex){ex.score=res.score;ex.ts=o.ts}

}

}

function visionAnalyse(url,cb){
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');c.width=96;c.height=96;
    var ctx=c.getContext('2d');ctx.drawImage(img,0,0,96,96);
    var d=ctx.getImageData(0,0,96,96).data,red=0,yellow=0,dark=0,white=0,n=96*96;
    for(var i=0;i<d.length;i+=4){var R=d[i],G=d[i+1],B=d[i+2];if(R>1.35*G&&R>1.35*B&&R>90)red++;if(R>150&&G>140&&B<130)yellow++;if(R+G+B<130)dark++;if(R>210&&G>210&&B>210)white++}
    var sc={lsd:cl(red/n*5.5+yellow/n*6,0,0.95),fmd:cl(white/n*4+red/n*2,0,0.9),mastitis:cl(red/n*4.5+dark/n*0.6,0,0.9),wound:cl(red/n*4,0,0.85)};
    var top=null;Object.keys(sc).forEach(function(k){if(!top||sc[k]>sc[top])top=k});
    var conf=Math.round(sc[top]*100);
    if(conf<35)top=null;
    cb({top:top,confidence:conf,note:'Heuristic image features — visual signal only. Not a diagnosis.'});
  };
  img.src=url;
}

function surveillanceClusters(){
  var byFarm={};
  DB.alerts.filter(function(a){return a.status==='active'}).forEach(function(a){
    var an=DB.animals.find(function(x){return x.id===a.animalId});if(!an)return;
    if(!byFarm[an.farmId])byFarm[an.farmId]={farmId:an.farmId,village:an.village,animals:[],symptoms:{},max:0};
    byFarm[an.farmId].animals.push({id:a.animalId,score:a.score});
    var lo=lastO(a.animalId);if(lo&&lo.evidence)lo.evidence.slice(0,3).forEach(function(e){var lab=evLabel(e)||e.l||'';if(lab)byFarm[an.farmId].symptoms[lab]=(byFarm[an.farmId].symptoms[lab]||0)+1});
    byFarm[an.farmId].max=Math.max(byFarm[an.farmId].max,a.score);
  });
  var out=[];
  Object.keys(byFarm).forEach(function(fid){var g=byFarm[fid];var top=Object.keys(g.symptoms).sort(function(a,b){return g.symptoms[b]-g.symptoms[a]})[0];var suspected=g.animals.length>=3;out.push({farmId:fid,village:g.village,count:g.animals.length,animals:g.animals,topSymptom:top,topCount:top?g.symptoms[top]:0,max:g.max,status:suspected?'suspected':'single'})});
  return out.sort(function(a,b){return b.count-a.count});
}
function villageRiskIndex(v){
  var farms=DB.farms.filter(function(f){return f.village===v});var ids=farms.map(function(f){return f.id});
  var animals=DB.animals.filter(function(a){return ids.indexOf(a.farmId)>=0&&a.status==='active'});
  var normal=0,watch=0,att=0,urgent=0;
  animals.forEach(function(a){var s=cScore(a.id);if(s<=30)normal++;else if(s<=60)watch++;else if(s<=80)att++;else urgent++});
  var ids2=animals.map(function(a){return a.id});var nowTs=nw();
  var recent=DB.observations.filter(function(o){return ids2.indexOf(o.animalId)>=0&&o.score>40&&o.ts>nowTs-7*DAY}).length;
  var prev=DB.observations.filter(function(o){return ids2.indexOf(o.animalId)>=0&&o.score>40&&o.ts>nowTs-14*DAY&&o.ts<=nowTs-7*DAY}).length;
  var trend=prev>0?Math.round((recent-prev)/prev*100):(recent>0?100:0);
  var sym={};
  DB.alerts.filter(function(a){return a.status==='active'&&ids2.indexOf(a.animalId)>=0}).forEach(function(al){var lo=lastO(al.animalId);if(!lo||!lo.evidence)return;lo.evidence.slice(0,3).forEach(function(e){var lab=evLabel(e)||e.l||'';if(lab)sym[lab]=(sym[lab]||0)+1})});
  var topSyms=Object.keys(sym).sort(function(a,b){return sym[b]-sym[a]}).slice(0,4).map(function(k){return{l:k,n:sym[k]}});
  var clusters=farms.filter(function(f){return herd(f.id).cluster}).length;
  var riskLevel=clusters>=2||urgent>=3?'elevated':(att>0||watch>3)?'moderate':'low';
  return{village:v,animals:animals.length,normal:normal,watch:watch,att:att,urgent:urgent,trend:trend,topSymptoms:topSyms,riskLevel:riskLevel,clusters:clusters};
}
function transmissionNetwork(){
  var villages=villagesList();
  var nodes=villages.map(function(v){var ri=villageRiskIndex(v);return{id:v,risk:ri.riskLevel,animals:ri.animals,urgent:ri.urgent,watch:ri.watch,clusters:ri.clusters,topSymptoms:ri.topSymptoms}});
  var edges=[];
  for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
    var a=nodes[i],b=nodes[j];
    var shared=a.topSymptoms.filter(function(x){return b.topSymptoms.some(function(y){return y.l===x.l})});
    if(shared.length>0&&(a.risk!=='low'||b.risk!=='low'))edges.push({from:a.id,to:b.id,shared:shared.map(function(s){return s.l}),strength:shared.length});
  }
  return{nodes:nodes,edges:edges};
}
function oneHealthIndex(v){
  var farms=DB.farms.filter(function(f){return f.village===v});var ids=farms.map(function(f){return f.id});
  var animals=DB.animals.filter(function(a){return ids.indexOf(a.farmId)>=0&&a.status==='active'});
  var zo=0,syms={};
  animals.forEach(function(a){var lo=lastO(a.id);if(!lo)return;var hits=[];(lo.evidence||[]).forEach(function(e){var lab=evLabel(e)||e.l||'';ZOONOTIC.forEach(function(zs){if(SYM[zs]&&SYM[zs].en===lab)hits.push(lab)})});if(hits.length){zo++;hits.forEach(function(k){syms[k]=(syms[k]||0)+1})}});
  return{village:v,animals:animals.length,zoAnimals:zo,symptoms:syms,level:zo>=3?'high':zo>=1?'moderate':'low'};
}

function qrSVG(text,px){
  px=px||180;var cells=21,cell=px/cells;var hash=0;for(var i=0;i<text.length;i++){hash=((hash<<5)-hash)+text.charCodeAt(i);hash=hash|0}
  var svg='<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'"><rect width="'+px+'" height="'+px+'" fill="#fff"/>';
  for(var y=0;y<cells;y++)for(var x=0;x<cells;x++){
    var fill=false;var inFind=(x<7&&y<7)||(x>=cells-7&&y<7)||(x<7&&y>=cells-7);
    if(inFind){var lx=x,ly=y;if(x>=cells-7)lx=x-(cells-7);if(y>=cells-7)ly=y-(cells-7);fill=(lx===0||lx===6||ly===0||ly===6)||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}
    else{var h=Math.abs(hash*(x+1)*(y+3))%100;fill=(h%3===0)}
    if(fill)svg+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="#0a1410"/>';
  }
  return svg+'</svg>';
}

function toggleMic(){
  if(!SR){toast('🎤 Speech not supported on this browser — please type instead','y',5000);return}
  if(V.recording){try{recog&&recog.stop()}catch(e){}V.recording=false;render();return}
  try{recog=new SR()}catch(e){toast('🎤 Mic init failed — type instead','r');return}
  var bl=BHASHINI.langs[S.lang];
  recog.lang=(bl&&bl.asr)||(STATES[S.state]&&STATES[S.state].tts)||'en-IN';
  recog.interimResults=true;recog.continuous=false;recog.maxAlternatives=1;
  var base=V.text?V.text+' ':'';
  var gotAnything=false;
  recog.onstart=function(){V.recording=true;render()};
  recog.onresult=function(e){
    gotAnything=true;
    var it='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var tt=e.results[i][0].transcript;
      if(e.results[i].isFinal)base+=tt+' ';
      else it+=tt;
    }
    V.text=(base+it).trim();
    V.extracted=extractFromText(V.text);
    var el=document.getElementById('scrNote');if(el)el.value=V.text;
    render();
  };
  recog.onerror=function(ev){
    V.recording=false;
    var code=ev&&ev.error?ev.error:'unknown';
    if(code==='not-allowed'||code==='service-not-allowed')toast('🎤 Mic permission denied — allow in browser settings','r',5000);
    else if(code==='no-speech')toast('🎤 No speech detected — tap and speak clearly','y');
    else if(code==='audio-capture')toast('🎤 No microphone found','r');
    else if(code==='network')toast('🎤 Network error — check internet (speech needs online)','r',5000);
    else if(code==='aborted'){}
    else toast('🎤 Error: '+code,'y');
    render();
  };
  recog.onend=function(){
    V.recording=false;
    if(!gotAnything&&!(V.text||'').trim())toast('🎤 Nothing heard — try again near the mic','y');
    render();
  };
  var start=function(){
    try{recog.start();V.recording=true;render()}
    catch(e){
      try{recog.stop()}catch(_){}
      setTimeout(function(){try{recog.start();V.recording=true;render()}catch(e2){toast('🎤 Could not start — type instead','r');V.recording=false;render()}},250);
    }
  };
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true})
      .then(function(stream){stream.getTracks().forEach(function(tr){tr.stop()});start()})
      .catch(function(){toast('🎤 Mic permission denied','r',5000);V.recording=false;render()});
  }else{start()}
}

function riskTimelineSVG(obs){
  var days=[];
  for(var d=6;d>=0;d--){var from=nw()-(d+1)*DAY,to=nw()-d*DAY;var dayObs=obs.filter(function(o){return o.ts>=from&&o.ts<to});var max=0;dayObs.forEach(function(o){if(o.score>max)max=o.score});days.push({d:7-d,v:max})}
  var W=320,H=180,padL=34,padR=14,padT=14,padB=30,cw=W-padL-padR,ch=H-padT-padB;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:180px;background:#0c1811;border:1px solid #27392d;border-radius:12px">';
  [0,20,40,60,80,100].forEach(function(v){var y=padT+ch-(v/100)*ch;svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="#27392d" stroke-dasharray="2 4"/><text x="4" y="'+(y+3)+'" font-size="9" fill="#8ba396">'+v+'</text>'});
  var y60=padT+ch-(60/100)*ch,y80=padT+ch-(80/100)*ch;
  svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y60+'" y2="'+y60+'" stroke="#ffc947" stroke-dasharray="4 3" opacity=".5"/>';
  svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y80+'" y2="'+y80+'" stroke="#ff5c5c" stroke-dasharray="4 3" opacity=".5"/>';
  var pts=days.map(function(x,i){var px=padL+(i/(days.length-1))*cw;var py=padT+ch-(x.v/100)*ch;return[px,py,x.v,x.d]});
  var path='';pts.forEach(function(p,i){path+=(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)});
  svg+='<path d="'+path+'" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach(function(p){var col=p[2]>80?'#ff5c5c':p[2]>60?'#ff9f43':p[2]>30?'#ffc947':'#3ddc84';svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+col+'"/><text x="'+p[0].toFixed(1)+'" y="'+(H-10)+'" font-size="9" fill="#8ba396" text-anchor="middle">D'+p[3]+'</text>'});
  var trig=-1;pts.forEach(function(p,i){if(trig<0&&p[2]>60)trig=i});
  if(trig>=0){var tp=pts[trig];svg+='<line x1="'+tp[0].toFixed(1)+'" x2="'+tp[0].toFixed(1)+'" y1="'+padT+'" y2="'+(padT+ch)+'" stroke="#ff5c5c" stroke-width="1" stroke-dasharray="2 3"/><text x="'+tp[0].toFixed(1)+'" y="'+(padT-3)+'" font-size="9" fill="#ff5c5c" text-anchor="middle">'+t('alertTrigger')+'</text>'}
  return svg+'</svg>';
}

function caseCard(c){
  var an=animalById(c.animalId);
  var pCls=c.priority==='p1'?'p1':c.priority==='p2'?'p2':'';
  var statusLabel=c.status==='new'?'🆕 '+t('upcoming'):c.status==='investigating'?'🔍 '+t('check'):c.status==='resolved'?'✅ '+t('verified'):c.status;
  var sCls=c.status==='resolved'?'g':c.priority==='p1'?'r':c.priority==='p2'?'y':'b';
  var isNew=c.status==='new';
  return'<div class="case '+pCls+'"'+(isNew?' style="border-left-color:#ff5c5c"':'')+'><div class="row between"><strong class="sm">'+(c.priority||'').toUpperCase()+' · '+c.id+(isNew?' 🔔':'')+'</strong><span class="bd '+sCls+'">'+statusLabel+'</span></div>'+

  '<div class="xs dim">'+(an?an.species+' · '+vl(an.village):'')+'</div>'+
  '<div class="xs dim">👤 '+(c.farmerName||'')+(c.farmerPhone?' · '+c.farmerPhone:'')+'</div>'+

function govVillages(){
  var byV={};
  DB.farms.forEach(function(f){
    if(!byV[f.village])byV[f.village]={village:f.village,farms:0,animals:0,alerts:0,clusters:0};
    byV[f.village].farms++;
    var h=herd(f.id);
    byV[f.village].animals+=h.total;
    byV[f.village].alerts+=h.flagged.length;
    if(h.cluster)byV[f.village].clusters++;
  });
  var keys=Object.keys(byV);
  return'<div class="card"><h2 style="margin-top:0">'+t('villages')+' ('+keys.length+')</h2></div>'+
  keys.map(function(v){
    var x=byV[v];
    var lvl=x.clusters?'r':x.alerts?'y':'g';
    return'<div class="card" data-act="gov-village" data-v="'+v+'"><div class="row between"><strong>'+vl(v)+'</strong><span class="bd '+lvl+'">'+(x.clusters?t('cluster'):x.alerts?t('watch'):t('normal'))+'</span></div><div class="xs dim" style="margin-top:4px">'+x.farms+' '+t('farm')+' · '+x.animals+' '+t('animals')+'</div></div>';
  }).join('');
}
function govVillageDetail(){
  var v=S._village;if(!v)return govVillages();
  var ri=villageRiskIndex(v);
  var riskCol=ri.riskLevel==='elevated'?'o':ri.riskLevel==='moderate'?'y':'g';
  var net=transmissionNetwork();
  var nextV='';
  net.edges.forEach(function(e){if(e.from===v)nextV=e.to;if(e.to===v&&!nextV)nextV=e.from});
  var fc=forecast7d(v);

  var h='<button class="b s" data-act="gov-back" style="margin-bottom:12px">← '+t('back')+'</button>';
  h+='<div class="card"><div class="row between"><div><div class="med">'+vl(v)+'</div><div class="xs dim">'+t('animalsMonitored')+'</div></div><span class="bd '+riskCol+'">'+(ri.riskLevel==='elevated'?'🟠 '+t('elevated'):ri.riskLevel==='moderate'?'🟡 '+t('moderate'):'🟢 '+t('low'))+'</span></div></div>';

  '<div class="stat"><div class="n" style="color:#3ddc84">'+ri.normal+'</div><div class="l">'+t('normal')+'</div></div>'+

  '<div class="stat"><div class="n" style="color:#ff5c5c">'+ri.urgent+'</div><div class="l">'+t('urgentAttention')+'</div></div>'+

  if(ri.topSymptoms.length){
    h+='<div class="card"><h2 style="margin-top:0">'+t('commonSymptoms')+'</h2>';
    ri.topSymptoms.forEach(function(s){h+='<div class="kv"><span>• '+symLabel(s.l)+'</span><span class="bd r">'+s.n+'</span></div>'});

function initLeafletMap(){
  if(S.mapReady)return;
  var el=document.getElementById('lmap');
  if(!el||typeof L==='undefined'){console.warn('Leaflet not loaded');return}
  try{
    var st=STATES[S.state]||STATES.KA;
    var map=L.map('lmap',{zoomControl:true}).setView([st.lat,st.lng],10);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
      maxZoom:16,
      attribution:'Tiles © Esri — Esri, DeLorme, NAVTEQ'
    }).addTo(map);
    villagesList().forEach(function(v){
      var c=villageCoords(v);
      var ri=villageRiskIndex(v);
      var col=ri.riskLevel==='elevated'?'#ff5c5c':ri.riskLevel==='moderate'?'#ffc947':'#3ddc84';
      var m=L.circleMarker([c.lat,c.lng],{radius:14,color:col,weight:3,fillColor:col,fillOpacity:.4}).addTo(map);
      m.bindPopup('<b>'+vl(v)+'</b><br/>'+ri.animals+' '+t('animals')+' · '+ri.urgent+' '+t('urgentAttention'));
      m.on('click',function(){S.govSection='village';S._village=v;render()});
      if(ri.riskLevel==='elevated')L.circle([c.lat,c.lng],{radius:5000,color:'#ff5c5c',weight:1,fillColor:'#ff5c5c',fillOpacity:0.06}).addTo(map);
    });
    haatsList().forEach(function(h){
      var m=L.circleMarker([h.lat,h.lng],{radius:8,color:'#4dabf7',weight:3,fillColor:'#4dabf7',fillOpacity:.5}).addTo(map);
      m.bindPopup('<b>🏪 '+h.name+'</b><br/>'+dayLabel(h.day)+' · '+h.radiusKm+' km');
    });
    S.mapReady=true;S.mapInstance=map;
  }catch(e){console.warn('map err',e)}
}
function govNetwork(){
  var net=transmissionNetwork();
  var W=340,H=280;
  var coords={'Village A':{x:170,y:140},'Village B':{x:170,y:40},'Village C':{x:50,y:140},'Village D':{x:290,y:140},'Village E':{x:170,y:240}};
  net.nodes.forEach(function(n,i){if(!coords[n.id])coords[n.id]={x:60+((i*47)%220),y:60+((i*37)%160)}});
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:280px;background:#0c1811;border:1px solid #27392d;border-radius:12px">';
  net.edges.forEach(function(e){
    var a=coords[e.from],b=coords[e.to];if(!a||!b)return;
    var col=e.strength>=2?'#ff5c5c':'#ffc947';
    svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+col+'" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>';
    var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    svg+='<text x="'+mx+'" y="'+my+'" font-size="7" fill="'+col+'" text-anchor="middle">'+e.shared.length+'</text>';
  });
  net.nodes.forEach(function(n){
    var c=coords[n.id];if(!c)return;
    var col=n.risk==='elevated'?'#ff5c5c':n.risk==='moderate'?'#ffc947':'#3ddc84';
    var r=n.risk==='elevated'?16:n.risk==='moderate'?13:11;
    svg+='<g data-act="gov-village" data-v="'+n.id+'"><circle cx="'+c.x+'" cy="'+c.y+'" r="'+r+'" fill="'+col+'" stroke="#0a1410" stroke-width="2" opacity="0.85"/>'+
    '<text x="'+c.x+'" y="'+(c.y+4)+'" font-size="10" fill="#0a1410" font-weight="800" text-anchor="middle">'+vl(n.id).replace(/\s+/g,'')+'</text>'+
    '<text x="'+c.x+'" y="'+(c.y+r+12)+'" font-size="8" fill="#8ba396" text-anchor="middle">'+n.animals+'</text></g>';
  });
  svg+='</svg>';
  return'<div class="card"><h2 style="margin-top:0">🕸️ '+t('transmissionNetwork')+'</h2>'+svg+'<div class="wr b" style="margin-top:10px">⚠️ '+t('networkNote')+'</div></div>';
}

  });

function doSync(){
  if(V.syncing)return;
  var q=DB.queue||[];
  if(!q.length){toast('✅ '+t('synced'),'g');return}
  V.syncing=true;render();
  var count=q.length;
  setTimeout(function(){
    DB.queue=[];
    if(Math.random()<0.5&&!DB.conflicts.length){
      DB.conflicts.push({id:uid(),topic:'FMD vaccination — COW-024',farmer:{ts:nw()-2*HOUR},vet:{ts:nw()-1*HOUR}});
    }
    DB.notifications.unshift({id:uid(),ts:nw(),type:'sync',title:t('synced'),body:count+' '+t('pendingSync'),read:false,audience:'both'});
    saveDB();V.syncing=false;
    toast('✅ '+count+'/ '+count+' '+t('synced'),'g');
    render();
  },1400);
}

  db.style.display=S.loggedIn?'inline-block':'none';

  sc.style.display=qlen>0?'inline-block':'none';sc.textContent=qlen;

  if(!S.state){nav.innerHTML='';app.innerHTML=vState();return}
  if(!S.langChosen){nav.innerHTML='';app.innerHTML=vLang();return}
  if(!S.role){nav.innerHTML='';app.innerHTML=vRole();return}
  if(!S.loggedIn){nav.innerHTML='';app.innerHTML=vLogin();attach();return}

  if(S.qrOpen){nav.innerHTML='';app.innerHTML=qrScanOverlay();attach();return}
  if(S.dataOpen){nav.innerHTML='';app.innerHTML=vData();attach();return}

  if(S.role==='farmer'){
    nav.innerHTML='<button data-tab="home" class="'+(S.screen==='home'?'on':'')+'"><span class="ic">🏠</span>'+t('home')+'</button>'+
    '<button data-tab="animals" class="'+(S.screen==='animals'?'on':'')+'"><span class="ic">🐄</span>'+t('animals')+'</button>'+
    '<button data-tab="milk" class="'+(S.screen==='milk'?'on':'')+'"><span class="ic">🥛</span>'+t('milk')+'</button>'+
    '<button data-tab="screen" class="'+(S.screen==='screen'?'on':'')+'"><span class="ic">🩺</span>'+t('screen')+'</button>'+
    '<button data-tab="docs" class="'+(S.screen==='docs'?'on':'')+'"><span class="ic">📄</span>'+t('docs')+'</button>'+
    '<button data-tab="help" class="'+(S.screen==='help'?'on':'')+'"><span class="ic">🚨</span>'+t('help')+'</button>';
    if(S.animalId){app.innerHTML=vAnimal(S.animalId);attach();return}
    var v=S.screen;
    if(v==='home')app.innerHTML=vHome();
    else if(v==='screen')app.innerHTML=vScreen();
    else if(v==='animals')app.innerHTML=vAnimals();
    else if(v==='milk')app.innerHTML=vMilk();
    else if(v==='docs')app.innerHTML=vDocs();
    else if(v==='register')app.innerHTML=vRegister();
    else if(v==='help')app.innerHTML=vHelp();
    else app.innerHTML=vHome();
    attach();return;
  }
  if(S.role==='vet'){
    if(S.caseId){app.innerHTML=vetCaseDetail(S.caseId);attach();return}
    if(S.consultCaseId){app.innerHTML=vetConsultForm(S.consultCaseId);attach();return}
    vetRender();return;
  }
  govRender();
}

  if(act==='gov-deploy'){

  if(act==='gov-notify'){

});

/* ===== BOOT ===== */
function boot(){
  try{
    var l=loadDB();
    DB=l||seed();
    /* Schema safety: ensure all array fields exist even for older saved data */
    ['animals','farms','observations','alerts','escalations','vaccinations','timeline','documents','cases','campaigns','notifications','outbreaks','queue','conflicts','milkRecords','prescriptions','haats'].forEach(function(k){
      if(!Array.isArray(DB[k]))DB[k]=[];
    });
    if(!DB.baselines||typeof DB.baselines!=='object')DB.baselines={};
    saveDB();
  }catch(err){
    try{DB=seed();saveDB()}catch(e2){}
  }
  render();
  setTimeout(function(){var sp=document.getElementById('sp');if(sp)sp.classList.add('out')},900);
}
boot();
